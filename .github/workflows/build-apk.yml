name: Build APK
# Rebuild after release signing secrets are configured

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Detect release signing secrets
        id: signing
        env:
          TPA_KEYSTORE_BASE64: ${{ secrets.TPA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TPA_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release publishing is skipped: permanent signing secrets are not configured."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tpa-calculator-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Set release version
        if: steps.signing.outputs.enabled == 'true'
        run: |
          echo "TPA_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
          echo "TPA_VERSION_NAME=1.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare permanent release signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          TPA_KEYSTORE_BASE64: ${{ secrets.TPA_KEYSTORE_BASE64 }}
        run: |
          echo "$TPA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tpa-release.jks"
          test -s "$RUNNER_TEMP/tpa-release.jks"
          echo "TPA_KEYSTORE_PATH=$RUNNER_TEMP/tpa-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          TPA_KEYSTORE_PASSWORD: ${{ secrets.TPA_KEYSTORE_PASSWORD }}
          TPA_KEY_ALIAS: ${{ secrets.TPA_KEY_ALIAS }}
          TPA_KEY_PASSWORD: ${{ secrets.TPA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tpa-calculator-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release for in-app update checks
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: TPA Premium 1.2.${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
