name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tpa-calculator-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare permanent signing keystore
        if: ${{ secrets.TPA_KEYSTORE_BASE64 != '' }}
        env:
          TPA_KEYSTORE_BASE64: ${{ secrets.TPA_KEYSTORE_BASE64 }}
        run: |
          echo "$TPA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tpa-release.jks"

      - name: Build signed release APK
        if: ${{ secrets.TPA_KEYSTORE_BASE64 != '' }}
        env:
          TPA_KEYSTORE_PATH: ${{ runner.temp }}/tpa-release.jks
          TPA_KEYSTORE_PASSWORD: ${{ secrets.TPA_KEYSTORE_PASSWORD }}
          TPA_KEY_ALIAS: ${{ secrets.TPA_KEY_ALIAS }}
          TPA_KEY_PASSWORD: ${{ secrets.TPA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload signed APK
        if: ${{ secrets.TPA_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tpa-calculator-release
          path: app/build/outputs/apk/release/*.apk
